<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dumbo settings</title>
    <style>
      :root { --bg: #f4f1f7; --card: #fff; --ink: #2b1f2a; --muted: #7a6b80; --line: #e3dbe9; --accent: #c86ea0; --accent-ink: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15121f; --card: #1f1a2d; --ink: #f2ecff; --muted: #a59bbf; --line: #2f2842; --accent: #8f7bff; --accent-ink: #fff; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 'Segoe UI', -apple-system, system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      header img { width: 48px; height: 48px; }
      h1 { font-size: 20px; margin: 0; }
      header p { margin: 0; color: var(--muted); font-size: 13px; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin-bottom: 14px; }
      h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
      h2 + .row { border-top: 0; }
      .row label { flex: 1; }
      .row small { display: block; color: var(--muted); font-size: 12px; }
      input[type=text], input[type=time], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
      input[type=text] { width: 150px; }
      input[type=range] { width: 150px; accent-color: var(--accent); }
      input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
      output { display: inline-block; min-width: 3.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { font: inherit; border: 0; background: transparent; color: var(--ink); padding: 6px 10px; cursor: pointer; }
      .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
      .react { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .react input { flex: 1; min-width: 0; width: auto !important; }
      .react button, .add { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
      .add { margin-top: 10px; }
      /* Actions: tick list (drag across boxes to paint) + ▶ try */
      .intro { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
      .bulk { display: flex; gap: 8px; margin: 6px 0 4px; }
      .bulk button, .try { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      .bulk button:hover, .try:hover { border-color: var(--accent); }
      .try { white-space: nowrap; }
      .agroup h3 { font-size: 13px; margin: 14px 0 2px; }
      .agroup .note { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
      .arow { display: grid; grid-template-columns: 26px 1fr auto auto; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 9px; user-select: none; -webkit-user-select: none; }
      .arow:hover { background: var(--bg); }
      .arow .aname { font-weight: 600; }
      .arow small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
      .arow.off .aname { color: var(--muted); font-weight: 400; }
      .tick { width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; }
      .tick[aria-checked=true] { background: var(--accent); border-color: var(--accent); }
      .tick[aria-checked=true]::after { content: ''; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: translateY(-1px) rotate(-45deg); }
      .tick:focus-visible, .try:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .gear { font: inherit; font-size: 15px; line-height: 1; width: 30px; height: 28px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; }
      .gear:hover, .gear[aria-expanded=true] { border-color: var(--line); background: var(--bg); color: var(--ink); }
      .gear.custom { color: var(--accent); }
      .tunebox { grid-column: 2 / -1; display: grid; gap: 8px; padding: 8px 0 4px; }
      .tunebox[hidden] { display: none; }
      .knob { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
      .knob .seg button { font-size: 12.5px; padding: 4px 9px; }
      body.painting, body.painting * { cursor: crosshair !important; }
      .saved { color: var(--muted); font-size: 12px; text-align: center; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="./assets/icon.png" alt="" />
        <div><h1 id="title">Dumbo</h1><p>Changes apply right away.</p></div>
      </header>

      <section>
        <h2>Pet</h2>
        <div class="row"><label for="name">Name</label><input id="name" type="text" maxlength="20" /></div>
        <div class="row"><label>Size</label>
          <div class="seg" id="sizeSeg"><button data-v="0.8">S</button><button data-v="1">M</button><button data-v="1.35">L</button></div></div>
        <div class="row"><label for="size">Custom size</label><input id="size" type="range" min="0.6" max="2" step="0.05" /><output id="sizeOut"></output></div>
        <div class="row"><label>Theme<small>Auto follows Windows light/dark</small></label>
          <div class="seg" id="themeSeg"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
      </section>

      <section id="actionsSection">
        <h2>Actions</h2>
        <p class="intro">Tick what he's allowed to do. Press on a box and drag over others to tick or untick many at once. <b>▶ Try</b> plays it right now. <b>⚙</b> tunes it (Auto = recommended, a little random).</p>
        <div class="bulk"><button id="allOn">All on</button><button id="allOff">All off</button><button id="resetTune" title="Every ⚙ back to Auto">Reset ⚙ to recommended</button></div>
        <div id="actionList"></div>
      </section>

      <section>
        <h2>Sleep</h2>
        <div class="row"><label for="sleepiness">Sleepiness<small>How much of the day he naps</small></label><input id="sleepiness" type="range" min="0" max="1" step="0.05" /><output id="sleepOut"></output></div>
        <div class="row"><label for="sleepStart">Bedtime</label><input id="sleepStart" type="time" /></div>
        <div class="row"><label for="sleepEnd">Wake up</label><input id="sleepEnd" type="time" /></div>
      </section>

      <section>
        <h2>Battery</h2>
        <div class="row"><label for="batteryLow">Feels tired below<small>Asks you to charge</small></label><input id="batteryLow" type="range" min="5" max="60" step="1" /><output id="lowOut"></output></div>
        <div class="row"><label for="batteryHigh">Flexes above<small>Asks you to unplug (3 times max)</small></label><input id="batteryHigh" type="range" min="60" max="100" step="1" /><output id="highOut"></output></div>
      </section>

      <section id="appsSection">
        <h2>Your windows &amp; apps</h2>
        <div class="row"><label for="visitWindows">Visit windows<small>Hops onto, peeks at, nibbles and (pretends to) push your windows</small></label><input id="visitWindows" type="checkbox" /></div>
        <div class="row"><label for="stretchEvery">Stretch reminder<small>After this many active minutes (0 = off)</small></label><input id="stretchEvery" type="range" min="0" max="120" step="5" /><output id="stretchOut"></output></div>
        <div class="row" style="display:block"><label>When you open an app…<small>App = its process name, e.g. Code, chrome, Spotify, Discord</small></label>
          <div id="reactions"></div>
          <button id="addReaction" class="add">+ Add app</button></div>
      </section>

      <section>
        <h2>System</h2>
        <div class="row"><label for="startWithWindows" id="autostartLabel">Start with Windows</label><input id="startWithWindows" type="checkbox" /></div>
        <div class="row"><label for="autoUpdate">Automatic updates<small>Checks for new versions every few hours; the update is used the next time he starts</small></label><input id="autoUpdate" type="checkbox" /></div>
      </section>
      <p class="saved" id="saved"></p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
