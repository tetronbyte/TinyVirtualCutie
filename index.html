<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dumbo</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
      /* Window is 240×220 (× size). Dumbo's stage is 120×116 at the bottom centre; the rest is
         transparent, click-through room for speech bubbles and jumps. */
      #stage { position: absolute; left: 25%; bottom: 0; width: 50%; height: 52.73%; }
      #stage.left { transform: scaleX(-1); }
      #art { width: 100%; height: 100%; }
      #art svg { width: 100%; height: 100%; display: block; overflow: visible; }

      #bubble {
        position: absolute; left: 50%; bottom: 54%; transform: translate(-50%, 6px) scale(.9); opacity: 0;
        max-width: 92%; padding: .45em .9em; border-radius: 1.2em; box-sizing: border-box;
        font: 800 5.6vw/1.25 'Nunito', 'Segoe UI Rounded', 'Segoe UI', -apple-system, system-ui, sans-serif; text-align: center;
        background: #fff; color: #3d2433; border: .2em solid #3d2433; pointer-events: none;
        transition: opacity .18s ease, transform .22s cubic-bezier(.3,1.6,.6,1); white-space: nowrap;
      }
      #bubble::after { content: ''; position: absolute; left: 50%; bottom: -.62em; width: .8em; height: .8em; background: inherit; border: inherit; border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
      #bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
      body.dark #bubble { background: #221d33; color: #f2ecff; border-color: #7e6bff; box-shadow: 0 0 .9em rgba(126,107,255,.45); }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <div id="stage"><div id="art"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
