# Builds Dumbo for Windows and macOS on GitHub's machines (this repo) and publishes releases to the
# public releases repo (package.json "updates.repo") that installed copies check for updates.
#
#   Test build:  Actions → "Build Dumbo" → Run workflow   → files under the run's Artifacts
#   Release:     bump "version" in package.json, commit, then
#                  git tag v0.3.2 && git push origin main --tags
#                → GitHub Release in the public repo with:
#                  Dumbo-Setup-<v>.exe, Dumbo-<v>-win-x64.zip, Dumbo-<v>-mac.dmg,
#                  dumbo-app-<v>.asar + update.json (signed; one update for both platforms)
#
# Secrets needed in THIS repo (Settings → Secrets and variables → Actions):
#   UPDATE_SIGNING_KEY     the Ed25519 private key (PEM text) — signs update.json
#   PUBLIC_RELEASE_TOKEN   fine-grained token with "Contents: read and write" on the public repo only
name: Build Dumbo

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json version v$v"; exit 1; }

      - name: Portable zip + update archive
        run: npm run package
        env:
          DUMBO_RELEASE_NOTES: ${{ github.event.head_commit.message }}

      - name: Sign update
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run sign-update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Installer
        run: npx --yes electron-builder@25.1.8 --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned (no certificate)

      - uses: actions/upload-artifact@v6
        with:
          name: Dumbo-windows
          path: |
            release/installer/Dumbo-Setup-*.exe
            release/Dumbo-*-win-x64.zip
            release/dumbo-app-*.asar
            release/update.json
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build pages
        run: npm run build

      - name: Dumbo.app (Intel + Apple Silicon)
        run: npx --yes electron-builder@25.1.8 --mac dir --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no Apple certificate

      - name: Sign (ad-hoc) + .dmg
        run: bash scripts/mac-dmg.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Dumbo-mac
          path: release/Dumbo-*-mac.dmg
          if-no-files-found: error

  publish:
    # Releases even if the Mac build fails (Windows users and updates still get it); the .dmg is
    # attached when it exists.
    needs: [windows, mac]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Public repo name
        id: pub
        run: |
          find out -type f
          r=$(node -p "require('./package.json').updates.repo")
          [ -n "$r" ] || { echo 'package.json updates.repo is empty'; exit 1; }
          echo "repo=$r" >> "$GITHUB_OUTPUT"

      - name: Publish release to the public repo
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ steps.pub.outputs.repo }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Dumbo ${{ github.ref_name }}
          make_latest: 'true'
          body: |
            ### Windows
            Download **Dumbo-Setup** .exe below and run it. If your PC has Smart App Control on, take the **win-x64.zip** instead: unzip, run Dumbo.exe.
            Windows may say "Windows protected your PC" → More info → Run anyway.

            ### Mac
            Download the **mac.dmg**, open it and drag Dumbo into Applications. First time only: open Dumbo, click "Done" on the warning, then System Settings → Privacy & Security → **Open Anyway**.

            **Already have Dumbo?** He updates himself.
          files: |
            out/**/Dumbo-Setup-*.exe
            out/**/Dumbo-*-win-x64.zip
            out/**/Dumbo-*-mac.dmg
            out/**/dumbo-app-*.asar
            out/**/update.json
