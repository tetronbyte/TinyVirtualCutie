# Windows installer (Dumbo-Setup-<version>.exe) and macOS Dumbo.app. Runs ONLY in GitHub Actions
# (.github/workflows/build.yml): it creates a new, unsigned exe, which Smart App Control blocks on the
# owner's PC — never run electron-builder locally. Local sharing build stays scripts/package.mjs.
# macOS: built as a universal (Intel + Apple Silicon) .app, then ad-hoc signed and put in a .dmg by
# scripts/mac-dmg.sh (no Apple Developer account: friends click "Open Anyway" once).
appId: dev.tinyvirtualcutie.dumbo
productName: Dumbo
directories:
  output: release/installer
files:
  - dist/**
  - electron/**
  - assets/**
  - '!assets/icon-mac.png'
  - package.json
extraResources:
  - from: assets/icon.ico
    to: dumbo.ico          # used by main.cjs for shortcuts (SHORTCUT_ICON)
win:
  target: nsis
  icon: assets/icon.ico
  executableName: Dumbo
mac:
  target: dir
  icon: assets/icon-mac.png
  category: public.app-category.entertainment
  identity: null           # no Apple certificate; mac-dmg.sh ad-hoc signs instead
  extendInfo:
    LSUIElement: true      # menu-bar app: no Dock icon
nsis:
  oneClick: true           # double-click → installed → Dumbo starts; no admin needed
  perMachine: false        # %LOCALAPPDATA%\Programs\Dumbo
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Dumbo
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  artifactName: Dumbo-Setup-${version}.exe
electronLanguages:
  - en-US
