<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dumbo preview</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #ece8ef; color: #2b1f2a; padding: 16px; }
      body.dark { background: #15121f; color: #f2ecff; }
      .stage { width: 420px; height: 406px; max-width: 100%; border-radius: 16px; background: rgba(127,127,127,.12); }
      .stage > div, .stage svg { width: 100%; height: 100%; display: block; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
      button { font: inherit; padding: 5px 11px; border-radius: 999px; border: 1px solid #b6abc8; background: transparent; color: inherit; cursor: pointer; }
      h4 { margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <h3>Dumbo animation preview (dev only)</h3>
    <div class="stage" id="stageBox"><div id="art"></div></div>
    <h4>Face (front view) — move the mouse over the box to test gaze</h4>
    <div class="row" id="faces"></div>
    <h4>Side-view clips</h4>
    <div class="row" id="btns"></div>
    <script type="module">
      import { Animator, FRONT_REST } from '/src/engine/animator.ts';
      import { clips, STAND } from '/src/engine/clips.ts';
      import { EXPRESSIONS } from '/src/art/front.js';
      const a = new Animator(document.getElementById('art'));
      a.setFront({ ...FRONT_REST });
      let theme = 'light';
      const add = (row, label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; document.getElementById(row).append(b); };
      for (const e of Object.keys(EXPRESSIONS)) add('faces', e, () => a.setFront({ ...FRONT_REST, expr: e }));
      const list = { earflap: clips.earflap, wave: clips.wave, walk: clips.walk, run: clips.run, sitDown: clips.sitDown, standUp: clips.standUp,
        curlUp: clips.curlUp, uncurl: clips.uncurl, danglePout: () => clips.dangle(true), pushups: () => clips.pushups(3), rope: () => clips.rope(4),
        trip: clips.trip, coding: () => clips.coding(1), flex: clips.flex, tired: clips.tired, chargedBounce: clips.chargedBounce };
      for (const [k, c] of Object.entries(list)) add('btns', k, () => { a.setSide(STAND); a.play(c()); });
      add('btns', 'toggle theme', () => { theme = theme === 'light' ? 'dark' : 'light'; document.body.classList.toggle('dark', theme === 'dark'); a.setTheme(theme); });
      document.getElementById('stageBox').addEventListener('mousemove', e => {
        if (a.view !== 'front') return;
        const r = e.currentTarget.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .4);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 120);
        a.face([{ s: { gaze: [dx / d * 13 * k, dy / d * 9 * k], tilt: Math.max(-7, Math.min(7, dx / 30)) }, ms: 150 }], false, 30);
      });
    </script>
  </body>
</html>
