<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dumbo preview</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #ece8ef; color: #2b1f2a; padding: 16px; }
      body.dark { background: #15121f; color: #f2ecff; }
      .stage { width: 480px; height: 464px; max-width: 100%; border-radius: 16px; background: rgba(127,127,127,.12); }
      .stage > div, .stage svg { width: 100%; height: 100%; display: block; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid #b6abc8; background: transparent; color: inherit; cursor: pointer; }
      .small { display: flex; gap: 16px; align-items: end; margin-top: 12px; }
      .small div { width: 120px; height: 116px; outline: 1px dashed #b6abc8; }
      .small svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <h3>Dumbo animation preview (dev only — real app runs in Tauri)</h3>
    <div class="stage"><div id="art"></div></div>
    <div class="row" id="btns"></div>
    <p>Actual on-desktop size (120×116 window):</p>
    <div class="small"><div id="mini"></div></div>
    <script type="module">
      import { Animator } from '/src/engine/animator.ts';
      import { clips, STAND } from '/src/engine/clips.ts';
      const a = new Animator(document.getElementById('art'));
      const m = new Animator(document.getElementById('mini'));
      a.set(STAND); m.set(STAND);
      let theme = 'light';
      const both = c => { a.play(c()); m.play(c()); };
      const list = {
        blink: () => clips.blink(STAND), earflap: clips.earflap, wave: clips.wave, walk: clips.walk, run: clips.run,
        sitDown: clips.sitDown, standUp: clips.standUp, fallAsleep: clips.fallAsleep, wakeUp: clips.wakeUp,
        dangleHappy: () => clips.dangle(false), danglePout: () => clips.dangle(true), petted: clips.petted, tickled: clips.tickled, happyBounce: clips.happyBounce, toStand: clips.toStand,
      };
      const btns = document.getElementById('btns');
      for (const [k, c] of Object.entries(list)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => both(c); btns.append(b); }
      const t = document.createElement('button'); t.textContent = 'toggle theme';
      t.onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; document.body.classList.toggle('dark', theme === 'dark'); a.setTheme(theme); m.setTheme(theme); };
      btns.append(t);
    </script>
  </body>
</html>
